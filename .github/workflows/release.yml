# Publie l'APK Android signé dans une release GitHub à chaque tag vX.Y.Z.
#   git tag v1.0.0 && git push origin v1.0.0
# Secrets requis : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS.
name: Release Android

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # JDK attendu par le daemon Gradle (client/gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Version à partir du tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          # 1.2.3 -> 10203 : toujours croissant tant que minor et patch < 100.
          echo "VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - name: Clé de signature
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests du code partagé
        working-directory: client
        run: ./gradlew :shared:testAndroidHostTest --console=plain

      - name: Build APK signé
        working-directory: client
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew :androidApp:assembleRelease --console=plain \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Vérification de la signature
        run: |
          apk=client/androidApp/build/outputs/apk/release/androidApp-release.apk
          # Échoue si l'APK n'a pas été signé (il s'appellerait alors *-unsigned.apk).
          test -f "$apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"
          mkdir dist
          cp "$apk" "dist/RecruiterChat-$VERSION_NAME.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "RecruiterChat $VERSION_NAME" --generate-notes

      - name: Nettoyage de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
