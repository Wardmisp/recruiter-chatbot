# Compile le client web (Compose Multiplatform, Wasm + repli JS) et publie le site
# sur GitHub Pages : site/ à la racine, l'appli dans chat/.
name: Site GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "site/**"
      - "cv/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # JDK attendu par le daemon Gradle (client/gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests du code partagé
        working-directory: client
        run: ./gradlew :shared:testAndroidHostTest --console=plain

      - name: Build web (Wasm + repli JS)
        working-directory: client
        run: ./gradlew :webApp:composeCompatibilityBrowserDistribution --console=plain

      - name: Assemblage du site
        run: |
          mkdir -p _site/chat
          cp -r site/. _site/
          # CV servis par Pages : téléchargeables même quand le serveur maison est éteint.
          cp -r cv _site/cv
          # Les source maps ne servent qu'au débogage : inutile de les publier.
          rsync -a --exclude '*.map' \
            client/webApp/build/dist/composeWebCompatibility/productionExecutable/ _site/chat/
          du -sh _site _site/chat

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
