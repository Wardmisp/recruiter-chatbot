    <style>
        /* Polices hébergées avec le site (licence OFL) : aucune requête vers un service tiers. */
        @font-face { font-family: "Fraunces"; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/fraunces-600.woff2) format("woff2"); }
        @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 600; font-display: swap; src: url(fonts/fraunces-600-italic.woff2) format("woff2"); }
        @font-face { font-family: "Public Sans"; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/public-sans-variable.woff2) format("woff2"); }

        :root {
            --paper: #f2f1ed;
            --ink: #161616;
            --ink-soft: #3a3833;
            --muted: #55534d;
            --rule: #c9c6bd;
            --accent: #b23a1c;
            /* Composant de chat : mêmes couleurs que le thème Compose (client/shared/.../ui/Theme.kt). */
            --chat-bg: #161616;
            --chat-bubble: #262522;
            --chat-text: #f2f1ed;
            --chat-muted: #c9c5bb;
            --chat-outline: #6f6c65;
            --chat-chip: #3a3935;
            --chat-accent: #f06b45;
            --serif: "Fraunces", Georgia, serif;
            --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
        a { color: var(--ink); }
        a:hover { color: var(--accent); }
        .wrap { max-width: 1180px; margin: 0 auto; padding: 0 32px; }
        :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

        /* Bandeau */
        .masthead {
            display: flex; flex-wrap: wrap; gap: 12px 32px; justify-content: space-between; align-items: center;
            padding: 22px 0; border-bottom: 2px solid var(--ink);
            font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
        }
        .masthead .sub { color: var(--muted); }
        .masthead nav { display: flex; gap: 20px; align-items: center; }
        .masthead nav a { text-decoration: none; }
        .lang { display: flex; gap: 2px; }
        .lang button {
            border: 0; background: none; cursor: pointer; padding: 4px 6px;
            font: 600 14px/1 var(--sans); letter-spacing: .08em; color: var(--muted);
        }
        .lang button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }

        /* Titre + composant de chat */
        .hero { display: flex; flex-wrap: wrap; gap: 56px; align-items: center; padding: 80px 0 88px; }
        .hero-text { flex: 999 1 540px; min-width: 0; }
        h1 { margin: 0; font: 600 clamp(44px, 6vw, 84px)/1.02 var(--serif); letter-spacing: -.02em; }
        h1 em { color: var(--accent); font-style: italic; }
        .intro { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-top: 40px; }
        .intro img { flex: none; width: 88px; height: 88px; border-radius: 50%; object-fit: cover; }
        .intro p { flex: 1 1 320px; margin: 0; font-size: 18px; color: var(--ink-soft); }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
        .btn {
            display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px;
            font-weight: 700; text-decoration: none; border: 2px solid var(--ink);
            transition: background .15s, color .15s;
        }
        .btn.solid { background: var(--ink); color: var(--paper); }
        .btn.solid:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn:not(.solid):hover { background: var(--ink); color: var(--paper); }

        /* Le composant : une copie HTML légère de l'écran d'accueil de l'appli, remplacée
           par la vraie appli (iframe chat/) à la première interaction. */
        .chat {
            position: relative; flex: 1 1 400px; max-width: 480px; height: 620px;
            display: flex; flex-direction: column; background: var(--chat-bg); color: var(--chat-text);
            box-shadow: 0 30px 60px rgba(22, 22, 22, .25); font-family: var(--sans);
        }
        .chat iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--chat-bg); }
        .chat.is-live .preview { visibility: hidden; }
        .preview { display: flex; flex-direction: column; height: 100%; }
        .chat-head { display: flex; align-items: center; gap: 8px; padding: 14px 8px 14px 18px; }
        .chat-head div { flex: 1; min-width: 0; }
        .chat-title { margin: 0; font: 600 19px/1.3 var(--serif); }
        .chat-sub { margin: 0; font-size: 12px; color: var(--chat-muted); }
        .chat-new { padding: 10px 12px; font-size: 13px; font-weight: 600; color: var(--chat-outline); }
        .tabs { display: flex; border-bottom: 1px solid var(--chat-chip); }
        .tabs button {
            flex: 1; padding: 12px 0 9px; border: 0; border-bottom: 3px solid transparent; background: none; cursor: pointer;
            font: 600 14px var(--sans); color: var(--chat-muted);
        }
        .tabs button[aria-selected="true"] { color: var(--chat-text); border-bottom-color: var(--chat-accent); }
        .messages { flex: 1; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; overflow: hidden; }
        .bubble { align-self: flex-start; margin: 0 48px 0 0; padding: 10px 14px; border-radius: 16px 16px 16px 4px; background: var(--chat-bubble); color: var(--chat-muted); font-size: 14px; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chips button {
            padding: 7px 14px; border-radius: 8px; border: 1px solid var(--chat-outline); background: none; cursor: pointer;
            color: var(--chat-text); font: 500 13px var(--sans); text-align: left;
        }
        .chips button:hover { background: var(--chat-bubble); }
        .composer { display: flex; gap: 8px; align-items: center; padding: 8px 16px; }
        .composer input {
            flex: 1; min-width: 0; min-height: 52px; padding: 0 14px; border: 1px solid var(--chat-outline); border-radius: 4px;
            background: none; color: var(--chat-text); font: 400 15px var(--sans);
        }
        .composer input::placeholder { color: var(--chat-muted); }
        .composer input:focus { outline: none; border: 2px solid var(--chat-accent); padding: 0 13px; }
        .composer button {
            min-height: 40px; padding: 0 22px; border: 0; border-radius: 999px; cursor: pointer;
            background: var(--chat-accent); color: var(--chat-bg); font: 600 14px var(--sans);
        }
        .disclaimer { margin: 0; padding: 6px 16px 10px; text-align: center; font-size: 11px; color: var(--chat-muted); }
        .chat :focus-visible { outline-color: var(--chat-accent); }
        /* Serveur injoignable (/health) : message de repli à la place des suggestions. */
        .down { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
        .down p { margin: 0; }
        .down div { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .down a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; font-weight: 600; text-decoration: none; }
        .down a:first-child { background: var(--chat-accent); color: var(--chat-bg); }
        .down a:last-child { border: 1px solid var(--chat-outline); color: var(--chat-text); }
        .chat.is-down .messages, .chat.is-down .composer { display: none; }
        .chat.is-down .down { display: flex; }

        /* Sections */
        section.block { display: flex; flex-wrap: wrap; gap: 16px 48px; padding: 56px 0; border-top: 1px solid var(--rule); }
        .label { flex: 0 0 180px; margin: 0; font: 600 22px/1.3 var(--serif); color: var(--accent); }
        .body { flex: 1 1 560px; min-width: 0; }
        .lead { margin: 0; font: 600 clamp(22px, 2.3vw, 30px)/1.4 var(--serif); }
        .jobs { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 48px; }
        .jobs li { display: flex; flex-wrap: wrap; gap: 8px 32px; }
        .year { flex: 0 0 140px; margin: 0; font: 600 56px/1 var(--serif); }
        .jobs div { flex: 1 1 360px; min-width: 0; }
        .jobs h3 { margin: 0; font-size: 20px; line-height: 1.35; }
        .when { margin: 4px 0 0; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
        .jobs p:last-child { margin: 12px 0 0; color: var(--ink-soft); }
        .countries { margin: 20px 0 0; font: 600 26px/1.4 var(--serif); }
        .skills { margin: 28px 0 0; font-size: 15px; color: var(--muted); }

        /* Contact */
        footer { padding: 80px 0 64px; border-top: 2px solid var(--ink); }
        .big { margin: 0; font: 600 clamp(40px, 6vw, 80px)/1.05 var(--serif); letter-spacing: -.02em; }
        .contact { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px 40px; font-size: 19px; font-weight: 600; }
        .about { margin-top: 56px; max-width: 760px; font-size: 15px; color: var(--muted); }
        .about summary { cursor: pointer; font-weight: 600; color: var(--ink); }
        .about ul { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 8px; }
        .source { margin: 24px 0 0; font-size: 14px; color: var(--muted); }

        /* Chargement : le titre monte, « Celle-ci » se souligne, le composant arrive. */
        @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
        @keyframes underline { from { background-size: 0% 6px; } to { background-size: 100% 6px; } }
        @keyframes appear { from { opacity: 0; transform: translateY(40px) scale(.98); } to { opacity: 1; transform: none; } }
        @keyframes bubble { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .in { animation: rise .9s cubic-bezier(.16, 1, .3, 1) both; }
        .in.d2 { animation-delay: .3s; } .in.d3 { animation-delay: .45s; }
        h1 em {
            background-image: linear-gradient(currentColor, currentColor); background-repeat: no-repeat;
            background-position: 0 92%; background-size: 0% 6px; animation: underline 1.1s ease-out 1s both;
        }
        .chat { animation: appear 1.1s cubic-bezier(.16, 1, .3, 1) .4s both; }
        .preview .bubble, .chips button { animation: bubble .5s cubic-bezier(.16, 1, .3, 1) both; }
        .preview .bubble { animation-delay: 1.2s; }
        .chips button:nth-child(1) { animation-delay: 1.6s; }
        .chips button:nth-child(2) { animation-delay: 1.75s; }
        .chips button:nth-child(3) { animation-delay: 1.9s; }

        /* Apparition au scroll : chaque bloc se « matérialise » (flou → net, décalé → en place).
           --delay échelonne les éléments d'un même groupe. */
        .js [data-reveal] {
            opacity: 0; transform: translateY(28px); filter: blur(8px);
            transition: opacity .8s ease var(--delay, 0s), transform .9s cubic-bezier(.16, 1, .3, 1) var(--delay, 0s), filter .8s ease var(--delay, 0s);
        }
        .js [data-reveal].is-visible { opacity: 1; transform: none; filter: none; }
        .js [data-reveal][data-side="above"]:not(.is-visible) { transform: translateY(-28px); }
        .js [data-reveal]:not(.is-visible) { transition-delay: 0s; }
        /* Les grandes années glissent depuis la gauche. */
        .js .year[data-reveal]:not(.is-visible) { transform: translateX(-40px); }

        @media (prefers-reduced-motion: reduce) {
            .in, .chat, h1 em, .preview .bubble, .chips button { animation: none; }
            h1 em { background-size: 100% 6px; }
            .js [data-reveal], .js [data-reveal]:not(.is-visible) { opacity: 1; transform: none; filter: none; transition: none; }
        }
        @media (max-width: 640px) {
            .wrap { padding: 0 20px; }
            .masthead .sub { display: none; }
            .hero { padding: 48px 0 64px; gap: 40px; }
            .chat { height: 560px; max-width: none; }
            .label { flex-basis: 100%; }
            .year { font-size: 44px; flex-basis: 100%; }
        }
    </style>
</head>

    let lang = (navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "en";

    function render() {
        const t = TEXTS[lang];
        document.documentElement.lang = lang;
        document.title = t.title;
        document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t[el.dataset.i18n]; });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => { el.placeholder = t[el.dataset.i18nPlaceholder]; });
        document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
        document.getElementById("cv-main").href = CV_BASE + t.cvMainFile;
        const frame = document.querySelector("#chat iframe");
        if (frame) frame.title = t.chatTitle;
    }

    document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
        if (b.dataset.lang === lang) return;
        lang = b.dataset.lang;
        render();
        // Appli déjà ouverte : rechargée dans la nouvelle langue (la conversation est enregistrée).
        const frame = document.querySelector("#chat iframe");
        if (frame) frame.src = chatUrl();
    }));
    render();

    // Composant de chat : la vraie appli (plusieurs Mo de WebAssembly) ne se charge qu'à la première
    // interaction ; une question déjà posée dans la copie lui est transmise (chat/?q=…).
    const chat = document.getElementById("chat");
    // L'appli suit la langue choisie sur la page, pas celle du navigateur.
    function chatUrl(question) {
        const params = new URLSearchParams({ lang });
        if (question) params.set("q", question);
        return CHAT_URL + "?" + params;
    }
    function loadChat(question) {
        if (chat.querySelector("iframe")) return;
        const frame = document.createElement("iframe");
        frame.src = chatUrl(question);
        frame.title = TEXTS[lang].chatTitle;
        frame.allow = "clipboard-write";
        // La copie reste affichée tant que l'appli n'a pas pris le relais : pas d'écran vide.
        frame.addEventListener("load", () => {
            chat.classList.add("is-live");
            frame.focus();
        });
        chat.appendChild(frame);
    }
    document.querySelectorAll("[data-ask]").forEach((b) => b.addEventListener("click", () => loadChat(b.textContent)));
    document.querySelectorAll("[data-open-chat]").forEach((b) => b.addEventListener("click", () => loadChat()));
    document.getElementById("composer").addEventListener("submit", (event) => {
        event.preventDefault();
        const question = document.getElementById("question").value.trim();
        if (question) loadChat(question);
    });

    // Visiteur qui revient avec une conversation enregistrée : on lui rend directement l'appli.
    try {
        const saved = localStorage.getItem(HISTORY_KEY);
        if (saved && saved !== "[]") loadChat();
    } catch (e) { /* stockage bloqué : la copie suffit */ }

    // Serveur injoignable : message de repli (e-mail, LinkedIn) à la place des suggestions.
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    fetch(HEALTH_URL, { cache: "no-store", signal: controller.signal })
        .then((response) => { if (!response.ok) throw new Error(String(response.status)); })
        .catch(() => { if (!chat.querySelector("iframe")) chat.classList.add("is-down"); })
        .finally(() => clearTimeout(timeout));

    // Apparition / disparition au scroll.
    const revealed = document.querySelectorAll("[data-reveal]");
    if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                // Côté de sortie : l'élément s'éloigne du bord franchi, ce qui évite tout clignotement
                // quand il reste à cheval sur ce bord.
                entry.target.dataset.side = entry.boundingClientRect.top < 0 ? "above" : "below";
                entry.target.classList.toggle("is-visible", entry.isIntersecting);
            });
        }, { rootMargin: "0px 0px -8% 0px", threshold: 0.12 });
        revealed.forEach((el) => observer.observe(el));
    } else {
        revealed.forEach((el) => el.classList.add("is-visible"));
    }
</script>
