    <style>
        :root {
            --primary: #2e5a88;
            --primary-strong: #1f4268;
            --primary-soft: #e3edf8;
            --accent: #3d8bd9;
            --text: #16202b;
            --muted: #5b6878;
            --bg: #f5f7fa;
            --card: #ffffff;
            --border: #e2e8ef;
            --shadow: 0 1px 2px rgba(16, 32, 52, .04), 0 8px 24px rgba(16, 32, 52, .07);
            --radius: 16px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #9cc3f0;
                --primary-strong: #c4dcf7;
                --primary-soft: #1c2c3e;
                --accent: #6aaeea;
                --text: #e8edf3;
                --muted: #9eabba;
                --bg: #0e1319;
                --card: #161e27;
                --border: #253140;
                --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
            }
        }

        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        /* Halo discret derrière l'en-tête */
        body::before {
            content: ""; position: absolute; inset: 0 0 auto 0; height: 420px; z-index: -1;
            background:
                radial-gradient(600px 260px at 15% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%),
                radial-gradient(500px 240px at 90% 10%, color-mix(in srgb, var(--primary) 16%, transparent), transparent 70%);
        }
        a { color: var(--primary); }
        main { max-width: 820px; margin: 0 auto; padding: 72px 20px 140px; }

        /* Sélecteur de langue */
        .lang {
            position: absolute; top: 18px; right: 20px; display: flex; padding: 3px;
            background: var(--card); border: 1px solid var(--border); border-radius: 999px; box-shadow: var(--shadow);
        }
        .lang button {
            border: 0; background: transparent; color: var(--muted); cursor: pointer;
            font: 600 13px/1 system-ui, sans-serif; padding: 7px 12px; border-radius: 999px;
        }
        .lang button[aria-pressed="true"] { background: var(--primary); color: var(--card); }

        /* En-tête */
        .hero { display: flex; gap: 24px; align-items: center; }
        /* Photo dans un anneau dégradé (le padding laisse voir le fond dégradé autour de l'image). */
        .avatar {
            flex: none; width: 96px; height: 96px; padding: 3px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--primary-strong));
            box-shadow: 0 8px 24px color-mix(in srgb, var(--primary) 35%, transparent);
        }
        .avatar img {
            display: block; width: 100%; height: 100%; border-radius: 50%;
            object-fit: cover; border: 3px solid var(--card); background: var(--card);
        }
        h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.4rem); line-height: 1.15; letter-spacing: -.02em; }
        .role { margin: 6px 0 0; font-size: 1.1rem; font-weight: 600; color: var(--primary); }
        .meta { margin: 6px 0 0; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .95rem; }
        .meta span { display: inline-flex; align-items: center; gap: 6px; }
        .meta svg { width: 16px; height: 16px; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; padding: 0; list-style: none; }
        .chips li {
            padding: 4px 12px; border-radius: 999px; font-size: .85rem; font-weight: 600;
            background: var(--primary-soft); color: var(--primary);
        }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 10px;
            font: 600 15px/1.2 system-ui, sans-serif; text-decoration: none; cursor: pointer;
            border: 1px solid var(--border); background: var(--card); color: var(--text);
            transition: transform .15s, box-shadow .15s, background .15s;
        }
        .btn svg { width: 18px; height: 18px; flex: none; }
        .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
        .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--card); }
        .btn.primary:hover { background: var(--primary-strong); }
        .btn:focus-visible, .lang button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

        /* Cartes et sections */
        section { margin-top: 56px; }
        h2 { margin: 0 0 16px; font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; }
        .card p { margin: 0; }

        /* Encart assistant, avec son « À propos » repliable */
        .assistant { position: relative; overflow: hidden; border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); }
        .assistant::before {
            content: ""; position: absolute; inset: 0 0 auto 0; height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--primary-strong));
        }
        .assistant-head { display: flex; gap: 16px; align-items: flex-start; }
        .assistant-icon {
            flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
            background: var(--primary-soft); color: var(--primary);
        }
        .assistant-icon svg { width: 22px; height: 22px; }
        .assistant h3 { margin: 0 0 4px; font-size: 1.15rem; }
        .assistant-head p { color: var(--muted); }
        .assistant .btn { margin-top: 18px; }
        .about { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
        .about summary {
            cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 8px;
            font-weight: 600; color: var(--primary); font-size: .95rem; border-radius: 6px;
        }
        .about summary::-webkit-details-marker { display: none; }
        .about summary svg { width: 16px; height: 16px; transition: transform .2s; }
        .about[open] summary svg { transform: rotate(90deg); }
        .about ul { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
        .about li { position: relative; padding-left: 22px; color: var(--muted); font-size: .95rem; }
        .about li::before {
            content: ""; position: absolute; left: 4px; top: .65em; width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent);
        }

        /* Frise des expériences */
        .timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
        .timeline li { display: grid; grid-template-columns: 150px 1fr; gap: 20px; }
        .timeline .when { color: var(--muted); font-size: .9rem; padding-top: 24px; text-align: right; }
        .timeline .card { padding: 20px 22px; }
        .timeline h3 { margin: 0; font-size: 1.02rem; }
        .timeline .company { color: var(--primary); font-weight: 600; font-size: .95rem; }
        .timeline p { margin-top: 8px; color: var(--muted); font-size: .95rem; }

        .countries { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; padding: 0; list-style: none; }
        .countries li { padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); font-size: .9rem; }

        .links { display: flex; flex-wrap: wrap; gap: 10px; }

        footer { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--border); color: var(--muted); font-size: .85rem; }

        /* Apparition au scroll : chaque bloc se « matérialise » (flou → net, décalé → en place).
           --delay échelonne les éléments d'un même groupe. */
        .js [data-reveal] {
            opacity: 0;
            transform: translateY(28px) scale(.97);
            filter: blur(10px);
            transition:
                opacity .8s ease var(--delay, 0s),
                transform .9s cubic-bezier(.16, 1, .3, 1) var(--delay, 0s),
                filter .8s ease var(--delay, 0s);
        }
        .js [data-reveal].is-visible { opacity: 1; transform: none; filter: none; }
        /* Disparition : l'élément sorti par le haut s'efface vers le haut, sans délai de cascade. */
        .js [data-reveal][data-side="above"]:not(.is-visible) { transform: translateY(-28px) scale(.97); }
        .js [data-reveal]:not(.is-visible) { transition-delay: 0s; }
        /* Les titres de section se resserrent en apparaissant. */
        .js h2[data-reveal] { letter-spacing: .45em; transition-property: opacity, transform, filter, letter-spacing; transition-duration: .8s, .9s, .8s, 1.1s; }
        .js h2[data-reveal].is-visible { letter-spacing: .12em; }
        @media (prefers-reduced-motion: reduce) {
            .js [data-reveal], .js h2[data-reveal], .js [data-reveal][data-side]:not(.is-visible) {
                opacity: 1; transform: none; filter: none; letter-spacing: .12em; transition: none;
            }
            .btn { transition: none; }
        }

        @media (max-width: 640px) {
            main { padding-top: 76px; }
            .hero { flex-direction: column; align-items: flex-start; gap: 16px; }
            .avatar { width: 80px; height: 80px; }
            .timeline li { grid-template-columns: 1fr; gap: 6px; }
            .timeline .when { padding-top: 0; text-align: left; }
            .actions .btn { flex: 1 1 auto; justify-content: center; }
        }
    </style>
</head>

            c1: "France", c2: "Switzerland", c3: "Luxembourg", c4: "Canada", c5: "Norway", c6: "Denmark",
            linksTitle: "Links",
            cvOther: "Resume in French", cvOtherFile: "Remi_MialonEvan_CV_FR.pdf",
            email: "Email",
            footer: "Source code of this site and the assistant:",
        },
    };

    let lang = (navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "en";

    function render() {
        const t = TEXTS[lang];
        document.documentElement.lang = lang;
        document.title = t.title;
        document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t[el.dataset.i18n]; });
        document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
        document.getElementById("cv-main").href = CV_BASE + t.cvMainFile;
        document.getElementById("cv-other").href = CV_BASE + t.cvOtherFile;
    }

    document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
        lang = b.dataset.lang;
        render();
    }));
    // Ouvre le panneau de la bulle (chat-widget.js, chargé en différé).
    document.querySelectorAll("[data-open-chat]").forEach((b) => b.addEventListener("click", () => {
        if (window.RecruiterChat) window.RecruiterChat.open();
    }));
    render();

    // Apparition / disparition au scroll : les enfants d'un groupe [data-stagger] apparaissent en cascade.
    document.querySelectorAll("[data-stagger]").forEach((group) => {
        [...group.children].forEach((child, index) => {
            child.setAttribute("data-reveal", "");
            child.style.setProperty("--delay", `${index * 70}ms`);
        });
    });
    const revealed = document.querySelectorAll("[data-reveal]");
    if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                // Côté de sortie : l'élément s'éloigne du bord franchi, ce qui évite tout clignotement
                // quand il reste à cheval sur ce bord.
                entry.target.dataset.side = entry.boundingClientRect.top < 0 ? "above" : "below";
                entry.target.classList.toggle("is-visible", entry.isIntersecting);
            });
        }, { rootMargin: "0px 0px -8% 0px", threshold: 0.12 });
        revealed.forEach((el) => observer.observe(el));
    } else {
        revealed.forEach((el) => el.classList.add("is-visible"));
    }
</script>
<script src="chat-widget.js" defer></script>
</body>
</html>
