<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Rémi Mialon-Evan — Ingénieur mobile Android / Kotlin</title>
    <meta name="description" content="Ingénieur mobile, référent technique Android / Kotlin. Mon CV à lire ou à parcourir en 3D, avec un assistant IA auto-hébergé.">
    <!-- Aperçu du lien partagé (LinkedIn, messageries) -->
    <meta property="og:type" content="profile">
    <meta property="og:title" content="Rémi Mialon-Evan — Ingénieur mobile Android / Kotlin">
    <meta property="og:description" content="Référent technique Android / Kotlin. Mon CV à lire ou à parcourir en 3D, avec un assistant IA auto-hébergé.">
    <meta property="og:url" content="https://wardmisp.github.io/recruiter-chatbot/">
    <meta property="og:image" content="https://wardmisp.github.io/recruiter-chatbot/photo.jpg">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preload" href="fonts/fraunces-600.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        @font-face { font-family: "Fraunces"; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/fraunces-600.woff2) format("woff2"); }
        @font-face { font-family: "Public Sans"; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/public-sans-variable.woff2) format("woff2"); }
        :root {
            --paper: #f2f1ed; --ink: #161616; --muted: #55534d; --accent: #b23a1c;
            --serif: "Fraunces", Georgia, serif;
            --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
            --pos: 50;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { background: var(--paper); color: var(--ink); font: 16px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
        :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

        /* Les deux vraies pages, côte à côte. Seule la page choisie reçoit les clics. */
        iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--paper); pointer-events: none; }
        #world { clip-path: inset(0 0 0 calc(var(--pos) * 1%)); }
        .chosen-classic:not(.dragging) #classic, .chosen-world:not(.dragging) #world { pointer-events: auto; }

        #stage { position: fixed; inset: 0; touch-action: none; cursor: ew-resize; user-select: none; -webkit-user-select: none; }
        .chosen-classic:not(.dragging) #stage, .chosen-world:not(.dragging) #stage { pointer-events: none; }
        .divider { position: absolute; top: 0; bottom: 0; left: calc(var(--pos) * 1%); width: 4px; margin-left: -2px; background: var(--ink); }
        .chosen-classic:not(.dragging) .divider, .chosen-world:not(.dragging) .divider { display: none; }
        .handle {
            position: absolute; top: 50%; left: calc(var(--pos) * 1%); width: 72px; height: 72px; margin: -36px 0 0 -36px; padding: 0;
            display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--accent); color: #fff; font-size: 28px; font-weight: 700;
            cursor: ew-resize; box-shadow: 0 6px 22px rgba(22, 22, 22, .35); touch-action: none; pointer-events: auto;
        }
        .handle:hover { background: var(--ink); }
        /* Mode choisi : la flèche reste accrochée au bord de l'écran. */
        .chosen-classic:not(.dragging) .handle { left: auto; right: 0; width: 44px; height: 72px; margin: -36px 0 0; border-radius: 36px 0 0 36px; font-size: 24px; }
        .chosen-world:not(.dragging) .handle { left: 0; width: 44px; height: 72px; margin: -36px 0 0; border-radius: 0 36px 36px 0; font-size: 24px; }
        /* Retour au centre ou fin du geste : animés seulement quand le doigt a lâché. */
        .settling iframe, .settling .divider, .settling:not(.chosen-classic):not(.chosen-world) .handle { transition: clip-path .45s cubic-bezier(.16, 1, .3, 1), left .45s cubic-bezier(.16, 1, .3, 1); }
        .nudge .handle { animation: nudge 1.8s ease-in-out .8s 2; }
        @keyframes nudge { 25% { transform: translateX(-22px); } 75% { transform: translateX(22px); } }

        .intro {
            position: fixed; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(520px, calc(100vw - 32px));
            padding: 14px 20px; text-align: center; background: var(--paper); border: 2px solid var(--ink); pointer-events: none;
        }
        h1 { margin: 0; font: 600 clamp(22px, 4vw, 30px)/1.15 var(--serif); }
        .intro p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }

        .choices { position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; gap: 12px; pointer-events: none; }
        .choice {
            pointer-events: auto; flex: 0 1 280px; min-height: 64px; padding: 10px 14px; text-align: left; font: inherit;
            color: var(--ink); background: var(--paper); border: 2px solid var(--ink); cursor: pointer;
        }
        .choice b { display: block; font: 600 19px/1.2 var(--serif); }
        .choice span { font-size: 14px; color: var(--muted); }
        .choice:hover { background: var(--ink); color: var(--paper); }
        .choice:hover span { color: inherit; }
        #pick-world { text-align: right; }
        .is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .is-active span { color: inherit; }
        .chosen-classic .intro, .chosen-world .intro, .chosen-classic .choices, .chosen-world .choices { display: none; }
        @media (prefers-reduced-motion: reduce) {
            .settling iframe, .settling .divider, .settling:not(.chosen-classic):not(.chosen-world) .handle { transition: none; }
            .nudge .handle { animation: none; }
        }
    </style>
</head>
<body class="nudge">
    <iframe id="classic" src="classique/" title="" inert></iframe>
    <iframe id="world" title="" inert></iframe>

    <div id="stage">
        <div class="divider"></div>
        <button type="button" id="handle" class="handle"><span id="arrow" aria-hidden="true">⇔</span></button>
    </div>

    <header class="intro">
        <h1 id="title">Choisissez votre visite</h1>
        <p id="subtitle">Glissez le curseur pour révéler une page.</p>
    </header>

    <div class="choices">
        <button type="button" class="choice" id="pick-classic"><b id="classic-name">Site classique</b><span id="classic-desc">L'essentiel de mon CV, à lire</span></button>
        <button type="button" class="choice" id="pick-world"><b id="world-name">Monde 3D</b><span id="world-desc">Mon CV à parcourir avec Valkea</span></button>
    </div>

    <noscript><p class="intro"><a href="classique/">Site classique</a></p></noscript>

<script>
    const TEXTS = {
        fr: { title: "Choisissez votre visite", subtitle: "Glissez le curseur pour révéler une page.", classicName: "Site classique", classicDesc: "L'essentiel de mon CV, à lire", worldName: "Monde 3D", worldDesc: "Mon CV à parcourir avec Valkea", slider: "Curseur de choix : flèches gauche et droite, puis Entrée", toClassic: "Passer au site classique", toWorld: "Passer au monde 3D" },
        en: { title: "Choose your visit", subtitle: "Drag the slider to reveal a page.", classicName: "Classic site", classicDesc: "My resume essentials, to read", worldName: "3D world", worldDesc: "Explore my resume with Valkea", slider: "Choice slider: left and right arrows, then Enter", toClassic: "Switch to the classic site", toWorld: "Switch to the 3D world" },
    };
    const THRESHOLD = 22;   // Avant le premier choix : à moins de 22 % d'un bord, le lâcher vaut choix.
    const TAP_DISTANCE = 6; // En pixels : en dessous, le geste compte comme un clic sur la flèche.
    const HASH = { classic: "#classique", world: "#monde" };
    const WORLD_URL = "monde/";

    const $ = (id) => document.getElementById(id);
    const root = document.documentElement;
    const body = document.body;
    const motionOk = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    let saved = null;
    try { saved = localStorage.getItem("site.lang"); } catch (e) { /* stockage bloqué : langue du navigateur */ }
    const lang = saved === "fr" || saved === "en" ? saved : ((navigator.language || "fr").toLowerCase().startsWith("fr") ? "fr" : "en");
    const t = TEXTS[lang];
    root.lang = lang;
    $("title").textContent = t.title;
    $("subtitle").textContent = t.subtitle;
    $("classic-name").textContent = t.classicName;
    $("classic-desc").textContent = t.classicDesc;
    $("world-name").textContent = t.worldName;
    $("world-desc").textContent = t.worldDesc;
    $("classic").title = t.classicName;
    $("world").title = t.worldName;

    // Sans WebGL, pas de monde 3D à proposer : on va directement au site classique.
    function webglAvailable() {
        try { return !!document.createElement("canvas").getContext("webgl2"); } catch (e) { return false; }
    }
    if (!webglAvailable()) location.replace("classique/");

    let chosen = null;      // null, "classic" ou "world".
    let worldLive = false;  // false tant que le monde n'est qu'un aperçu.

    const tellWorld = (message) => $("world").contentWindow?.postMessage(message, location.origin);

    function renderHandle() {
        const handle = $("handle");
        $("arrow").textContent = chosen === "classic" ? "←" : chosen === "world" ? "→" : "⇔";
        const label = chosen === "classic" ? t.toWorld : chosen === "world" ? t.toClassic : t.slider;
        handle.setAttribute("aria-label", label);
        handle.title = chosen ? label : "";
        document.title = `Rémi Mialon-Evan — ${chosen === "classic" ? t.classicName : chosen === "world" ? t.worldName : t.title}`;
    }
    function setPosition(pos) {
        const value = Math.max(0, Math.min(100, pos));
        root.style.setProperty("--pos", value);
        $("pick-classic").classList.toggle("is-active", value >= 100 - THRESHOLD);
        $("pick-world").classList.toggle("is-active", value <= THRESHOLD);
    }
    function settle(pos) {
        body.classList.remove("nudge", "dragging");
        body.classList.add("settling");
        setPosition(pos);
    }
    function choose(side) {
        chosen = side;
        settle(side === "classic" ? 100 : 0);
        body.classList.toggle("chosen-classic", side === "classic");
        body.classList.toggle("chosen-world", side === "world");
        $("classic").inert = side !== "classic";
        $("world").inert = side !== "world";
        history.replaceState(null, "", HASH[side]);
        if (side === "world" && !worldLive) {
            worldLive = true;
            tellWorld("choix:jouer");
        }
        // Le monde caché ne consomme rien : il reprend là où il en était.
        tellWorld(side === "classic" ? "choix:pause" : "choix:reprendre");
        // Sinon le clavier resterait ici et les flèches ne feraient plus marcher Valkea.
        if (side === "world") $("world").focus();
        renderHandle();
    }
    const other = () => (chosen === "classic" ? "world" : "classic");
    function release(pos) {
        if (chosen) choose(pos < 50 ? "world" : "classic");
        else if (pos >= 100 - THRESHOLD) choose("classic");
        else if (pos <= THRESHOLD) choose("world");
        else settle(50);
    }

    // Avant le choix : glisser depuis n'importe où. Après : depuis la flèche, ou un simple clic dessus.
    const stage = $("stage");
    const percent = (e) => e.clientX / innerWidth * 100;
    let dragging = false;
    let startX = 0;
    let moved = false;
    stage.addEventListener("pointerdown", (e) => {
        dragging = true;
        moved = false;
        startX = e.clientX;
        stage.setPointerCapture(e.pointerId);
        if (!chosen) {
            body.classList.remove("nudge", "settling");
            setPosition(percent(e));
        }
    });
    stage.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        if (!moved && Math.abs(e.clientX - startX) < TAP_DISTANCE) return;
        moved = true;
        body.classList.remove("nudge", "settling");
        body.classList.add("dragging");
        tellWorld("choix:reprendre");
        setPosition(percent(e));
    });
    stage.addEventListener("pointerup", (e) => {
        if (!dragging) return;
        dragging = false;
        if (chosen && !moved) choose(other());
        else release(percent(e));
    });
    stage.addEventListener("pointercancel", () => {
        dragging = false;
        if (chosen) choose(chosen);
        else settle(50);
    });

    $("pick-classic").addEventListener("click", () => choose("classic"));
    $("pick-world").addEventListener("click", () => choose("world"));

    // Clavier : flèches pour déplacer, Entrée pour valider le côté le plus révélé ou changer de mode.
    $("handle").addEventListener("keydown", (e) => {
        const current = Number(getComputedStyle(root).getPropertyValue("--pos"));
        if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            if (chosen) choose(other());
            else if (current !== 50) choose(current > 50 ? "classic" : "world");
        } else if (!chosen && e.key === "ArrowRight") { settle(current + 10); e.preventDefault(); }
        else if (!chosen && e.key === "ArrowLeft") { settle(current - 10); e.preventDefault(); }
    });

    // Le bouton « Mode classique » du monde reste dans cet écran.
    addEventListener("message", (e) => {
        if (e.origin === location.origin && e.source === $("world").contentWindow && e.data === "choix:classique") choose("classic");
    });

    // Adresse directe vers un mode (#classique ou #monde), par exemple depuis un CV.
    const direct = location.hash === HASH.classic ? "classic" : location.hash === HASH.world ? "world" : null;
    $("world").src = direct === "world" ? WORLD_URL : `${WORLD_URL}?apercu`;
    setPosition(50);
    renderHandle();
    if (direct === "world") worldLive = true;
    if (direct) {
        body.classList.remove("nudge");
        // Le monde écoute ses messages une fois chargé.
        if (direct === "classic") $("world").addEventListener("load", () => tellWorld("choix:pause"), { once: true });
        choose(direct);
    }
</script>
</body>
</html>
